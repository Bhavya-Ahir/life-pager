# Life Pager Rev A - built only from ready-made modules. No custom circuit, no loose components.
# `python3 hardware/tools/build.py` checks this file and regenerates bom.csv + wiring.svg.
#
# pins:   the connection points of each module that this design uses
# nc:     pins deliberately left unconnected
# nets:   wires, cables or plug-in connections between modules
# verify: something to confirm on the bench before trusting the connection
#
# What the modules already contain (so we do not build it): the EN05 carries the e-paper
# connector, 3 buttons, battery connector, power switch and charging; the XIAO has Bluetooth,
# USB-C and battery sensing; the Grove module has its own motor driver transistor and diode.

parts:
  U1:
    name: Seeed Studio XIAO nRF52840 Plus
    role: MCU and Bluetooth; plugs into the EN05
    qty: 1
    source: seeedstudio.com
    cost_usd: 9.9
    pins: [SOCKET, D0, D4, D5, 3V3, GND]
    gpio: {D0: P0.02, D4: P0.04, D5: P0.05}
    verify: Must be the Plus version - the EN05 uses its extra back pads D11 and D16 for the
      display. D0, D4 and D5 are the only pins the EN05 leaves free.

  A1:
    name: Seeed Studio XIAO ePaper Display Board EN05 (nRF52840)
    role: carrier - e-paper connector, 3 side buttons, battery JST + power switch, charging
    qty: 1
    source: Seeed 100085486
    cost_usd: 9.9
    pins: [XIAO, FPC24, BAT_JST]
    verify: Set the panel jumper/selection for a 24-pin panel if your board revision has one.
      Board outline, button and switch positions are needed for the enclosure (see
      enclosure/README.md).

  DS1:
    name: Seeed 1.54" monochrome e-paper 200x200 (SSD1681, GoodDisplay GDEY0154D67)
    role: always-on display; ribbon plugs into the EN05
    qty: 1
    source: seeedstudio.com (or any GDEY0154D67)
    cost_usd: 7.0
    pins: [FPC24]

  M1:
    name: Seeed Grove - Vibration Motor
    role: silent alert; on-board driver, logic-level input (HIGH = vibrate)
    qty: 1
    source: Seeed 105020003
    cost_usd: 4.5
    pins: [GROVE]
    verify: Runs from 3.0-5.5 V. At 3.3 V it is a little weaker than at 5 V; check it is strong
      enough to notice in a pocket.

  W1:
    name: Grove to female jumper cable (4-pin)
    role: connects M1 to the XIAO pins
    qty: 1
    source: seeedstudio.com (4-pin female jumper to Grove)
    cost_usd: 2.9
    pins: [GROVE, SIG, VCC, GND]
    verify: The XIAO sits on the EN05, so D0 / 3V3 / GND are reached at its castellated edge. Cut
      the jumper ends and solder the three wires to those pads (or to the EN05 extension port if
      your revision breaks them out).

  BT1:
    name: LiPo 3.7 V about 1000 mAh, 803040 size, JST-PH 2.0 plug, with protection circuit
    role: battery
    qty: 1
    source: generic
    cost_usd: 9.0
    pins: [PLUG]
    verify: JST-PH red/black polarity varies between sellers. Check against the EN05's +/-
      marking before plugging in.

  # ------------------------------------------------------------------ optional: away mode (LTE-M)
  U2:
    name: Makerdiary nRF9151 Connect Kit (optional, for away mode)
    role: LTE-M modem running Nordic's stock Serial Modem firmware
    qty: 1
    source: makerdiary.com
    cost_usd: 39.9
    pins: [BAT_IN, GND, P0.02, P0.03]
    gpio: {P0.02: UART TX (modem out), P0.03: UART RX (modem in)}
    verify: Set its I/O voltage to 3.3 V and measure it before connecting to the XIAO. Confirm
      P0.02 / P0.03 are free on its header and which connector is the battery input.

  W2:
    name: JST-PH 2.0 Y splitter cable (1 plug to 2 sockets)
    role: shares BT1 between the EN05 and the nRF9151 kit (only with U2)
    qty: 1
    source: generic
    cost_usd: 3.0
    pins: [IN, OUT_A, OUT_B]

extras:   # no connections in this file, but you need them
  - {name: LTE flex antenna with U.FL (ships with the Connect Kit; only with U2), qty: 1, cost_usd: 0}
  - {name: Nano SIM with LTE-M data, e.g. 1NCE or Hologram (only with U2), qty: 1, cost_usd: 15}
  - {name: "M2 x 6 mm self-tapping screws", qty: 4, cost_usd: 1}
  - {name: Thin double-sided tape for the display panel and modules, qty: 1, cost_usd: 2}

nets:
  # plug-in connections, no tools
  PLUG_XIAO:  [U1.SOCKET, A1.XIAO]          # XIAO onto the EN05
  PLUG_PANEL: [DS1.FPC24, A1.FPC24]         # ribbon into the 24-pin connector, contacts as marked
  PLUG_GROVE: [M1.GROVE, W1.GROVE]          # Grove cable into the motor module
  PLUG_BAT:   [BT1.PLUG, W2.IN]             # without U2: skip W2, plug BT1 straight into A1.BAT_JST
  PLUG_BAT_A: [W2.OUT_A, A1.BAT_JST]
  # soldered wires from the Grove cable's jumper ends to the XIAO's edge pads
  HAPTIC:     [W1.SIG, U1.D0]
  3V3:        [W1.VCC, U1.3V3]
  GND:        [W1.GND, U1.GND, U2.GND]       # U2.GND only when the LTE kit is fitted
  # optional LTE kit: two signal wires (+ ground above) and the battery lead
  UART_TX:    [U1.D4, U2.P0.03]
  UART_RX:    [U1.D5, U2.P0.02]
  VBAT_MODEM: [W2.OUT_B, U2.BAT_IN]
